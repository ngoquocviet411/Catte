<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cát-tê 6 Người Chơi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #004d25; color: white; text-align: center; margin: 0; padding: 20px; }
        .card { display: inline-block; background: white; color: black; border-radius: 6px; padding: 12px 16px; margin: 5px; font-weight: bold; font-size: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .red { color: red; }
        #room { margin: 20px 0; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; }
        button { padding: 10px 20px; font-size: 16px; background: #ffcc00; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; margin: 5px; }
        button:hover { background: #e6b800; }
        #announcement { font-size: 20px; font-weight: bold; color: #ffeb3b; margin: 15px 0; }
    </style>
</head>
<body>
    <h1>Sảnh Cát-tê 6 Người (Luật 3 Ván Thắng Tùng)</h1>
    
    <div id="login">
        <input type="text" id="username" placeholder="Nhập tên của bạn" style="padding: 10px; font-size: 16px;">
        <button onclick="join()">Vào Phòng</button>
    </div>

    <div id="game" style="display:none;">
        <div id="announcement"></div>
        <div id="room">
            <h3>Danh sách người chơi (<span id="count">0</span>/6):</h3>
            <ul id="playerList" style="list-style: none; padding: 0;"></ul>
            <button id="startBtn" onclick="startGame()">Chia Bài / Bắt Đầu</button>
        </div>

        <h2>Bài Của Bạn</h2>
        <div id="myHand"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function join() {
            const name = document.getElementById('username').value;
            if (!name) return alert('Vui lòng nhập tên');
            socket.emit('joinRoom', name);
            document.getElementById('login').style.display = 'none';
            document.getElementById('game').style.display = 'block';
        }

        function startGame() {
            document.getElementById('announcement').innerText = '';
            socket.emit('startGame');
        }

        socket.on('updateRoom', (players) => {
            document.getElementById('count').innerText = players.length;
            const list = document.getElementById('playerList');
            list.innerHTML = players.map(p => `<li>🟢 <b>${p.name}</b> ${p.cardCount ? `(${p.cardCount} lá)` : ''}</li>`).join('');
        });

        socket.on('dealCards', (hand) => {
            const handDiv = document.getElementById('myHand');
            handDiv.innerHTML = hand.map(c => {
                const isRed = c.suit === '♥' || c.suit === '♦';
                return `<div class="card ${isRed ? 'red' : ''}">${c.value} ${c.suit}</div>`;
            }).join('');
        });

        socket.on('gameStarted', (msg) => {
            document.getElementById('announcement').innerText = msg;
        });

        socket.on('roundWon', (msg) => {
            document.getElementById('announcement').innerText = msg;
        });

        socket.on('gameOver', (msg) => {
            document.getElementById('announcement').innerText = msg;
            alert(msg);
        });

        socket.on('errorMsg', (msg) => alert(msg));
    </script>
</body>
</html>
