<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cát-tê 6 Người - VNPT Cloud</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #004d25; color: white; text-align: center; margin: 0; padding: 20px; }
        .card { display: inline-block; background: white; color: black; border-radius: 6px; padding: 12px 14px; margin: 5px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
        .card:hover { transform: translateY(-5px); background: #fff3cd; }
        .red { color: red; }
        #room { margin: 15px 0; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; }
        button { padding: 10px 20px; font-size: 16px; background: #ffcc00; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #e6b800; }
        .table-area { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 8px; margin: 15px 0; min-height: 80px; }
    </style>
</head>
<body>
    <h1>Sảnh Cát-tê 6 Người (Luật 3 Ván Tùng)</h1>
    
    <div id="login">
        <input type="text" id="username" placeholder="Nhập tên của bạn" style="padding: 10px; font-size: 16px;">
        <button onclick="join()">Vào Phòng</button>
    </div>

    <div id="game" style="display:none;">
        <div id="room">
            <h3>Danh sách người chơi (<span id="count">0</span>/6):</h3>
            <ul id="playerList" style="list-style: none; padding: 0;"></ul>
            <button id="startBtn" onclick="startGame()">Bắt Đầu Ván Đấu</button>
        </div>

        <h3 id="turnStatus">Đang chờ bắt đầu...</h3>
        
        <div class="table-area">
            <h4>Bàn đánh:</h4>
            <div id="tableCards">Chưa có lá bài nào được đánh</div>
        </div>

        <h2>Bài Trên Tay Của Bạn (Bấm vào lá bài để đánh)</h2>
        <div id="myHand"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function join() {
            const name = document.getElementById('username').value;
            if (!name) return alert('Vui lòng nhập tên');
            socket.emit('joinRoom', name);
            document.getElementById('login').style.display = 'none';
            document.getElementById('game').style.display = 'block';
        }

        function startGame() {
            socket.emit('startGame');
        }

        function playCard(index) {
            socket.emit('playCard', index);
        }

        socket.on('updateRoom', (room) => {
            document.getElementById('count').innerText = room.players.length;
            const list = document.getElementById('playerList');
            list.innerHTML = room.players.map(p => `<li>🟢 <b>${p.name}</b></li>`).join('');
        });

        socket.on('gameState', (state) => {
            document.getElementById('count').innerText = state.players.length;
            
            // Hiển thị bàn đánh
            const tableDiv = document.getElementById('tableCards');
            if (state.tableCards.length === 0) {
                tableDiv.innerHTML = "Chưa có lá bài nào được đánh";
            } else {
                tableDiv.innerHTML = state.tableCards.map(t => {
                    const isRed = t.card.suit === '♥' || t.card.suit === '♦';
                    return `<div style="display:inline-block; margin: 0 10px; text-align:center;">
                        <div><b>${t.player}</b></div>
                        <div class="card ${isRed ? 'red' : ''}">${t.card.value} ${t.card.suit}</div>
                    </div>`;
                }).join('');
            }

            // Hiển thị lượt đi
            const currentTurnPlayer = state.players[state.turnIndex];
            if (currentTurnPlayer) {
                document.getElementById('turnStatus').innerText = `Đang là lượt của: ${currentTurnPlayer.name}`;
            }
        });

        socket.on('myHand', (hand) => {
            const handDiv = document.getElementById('myHand');
            handDiv.innerHTML = hand.map((c, index) => {
                const isRed = c.suit === '♥' || c.suit === '♦';
                return `<div class="card ${isRed ? 'red' : ''}" onclick="playCard(${index})">${c.value} ${c.suit}</div>`;
            }).join('');
        });

        socket.on('errorMsg', (msg) => alert(msg));
    </script>
</body>
</html>
